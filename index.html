<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Md Yeasir Arafat | Portfolio</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f5f7fa;
      color:#222;
    }

    header{
      background:#0d1b2a;
      color:white;
      padding:18px 35px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:1000;
    }

    header h1{
      font-size:20px;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:15px;
      font-size:14px;
      transition:0.3s;
    }

    nav a:hover{
      color:#00b4d8;
    }

    .hero{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:70px 35px;
      background:linear-gradient(to right,#0d1b2a,#1b263b);
      color:white;
      flex-wrap:wrap;
    }

    .hero-text{
      max-width:500px;
    }

    .hero-text h2{
      font-size:36px;
      margin-bottom:12px;
    }

    .hero-text p{
      font-size:15px;
      margin-bottom:20px;
      line-height:1.7;
      color:#dce3ea;
    }

    .hero-text button{
      padding:12px 25px;
      border:none;
      background:#00b4d8;
      color:white;
      font-size:15px;
      border-radius:6px;
      cursor:pointer;
      transition:0.3s;
    }

    .hero-text button:hover{
      background:#0096c7;
    }

    .hero img{
      width:320px;
      height:400px;
      object-fit:cover;
      border-radius:15px;
      border:4px solid #00b4d8;
      margin-top:20px;
    }

    section{
      padding:60px 35px;
    }

    .section-title{
      font-size:28px;
      margin-bottom:25px;
      text-align:center;
      color:#0d1b2a;
    }

    .about{
      max-width:900px;
      margin:auto;
      text-align:center;
      line-height:1.8;
      font-size:16px;
      color:#333;
    }

    .skills{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-top:30px;
    }

    .skill-card{
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0px 4px 10px rgba(0,0,0,0.08);
      text-align:center;
      transition:0.3s;
    }

    .skill-card:hover{
      transform:translateY(-5px);
    }

    .skill-card h3{
      margin-bottom:10px;
      color:#00b4d8;
    }

      display:grid
